# URCD-YOLO11s Object Detection Model for UAV Road Crack Detection
# Reference: Yi, Wang & Yan, Egyptian Informatics Journal (2026)
# Four targeted innovations:
# 1. Improved BiFPN: Softmax-normalized weighted bidirectional feature fusion
# 2. WADown: Weighted Adaptive Dual-path Downsampling preserving micro-cracks
# 3. WTConv: Wavelet Transform Convolution embedded in C3k2
# 4. MSCA: Multi-Scale Channel Attention targeting linear crack textures

# Parameters
nc: 6 # 6 canonical pavement distress classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # URCD-YOLO11s

# URCD-YOLO11s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2
  - [-1, 1, WADown, [256]]             # 3-P3/8 (WADown replaces Conv downsampler)
  - [-1, 2, C3k2_WTConv, [512, False, 0.25]] # 4-P3 (Wavelet convolution block)
  - [-1, 1, WADown, [512]]             # 5-P4/16 (WADown replaces Conv downsampler)
  - [-1, 2, C3k2_WTConv, [512, True]]  # 6-P4 (Wavelet convolution block)
  - [-1, 1, WADown, [1024]]            # 7-P5/32 (WADown replaces Conv downsampler)
  - [-1, 2, C3k2_WTConv, [1024, True]] # 8-P5 (Wavelet convolution block)
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 1, MSCA, []]                  # 10 (Multi-Scale Channel Attention on P5)

# URCD-YOLO11s head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, BiFPN_Concat2, [1]]           # 12 (BiFPN Softmax-weighted fusion with P4)
  - [-1, 2, C3k2_WTConv, [512, False]]         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, BiFPN_Concat2, [1]]           # 15 (BiFPN Softmax-weighted fusion with P3)
  - [-1, 2, C3k2_WTConv, [256, False]]         # 16 (P3/8-small crack detector)

  - [-1, 1, WADown, [256]]                     # 17 (WADown downsampling)
  - [[-1, 13], 1, BiFPN_Concat2, [1]]          # 18 (BiFPN Softmax-weighted fusion with head P4)
  - [-1, 2, C3k2_WTConv, [512, False]]         # 19 (P4/16-medium crack detector)

  - [-1, 1, WADown, [512]]                     # 20 (WADown downsampling)
  - [[-1, 10], 1, BiFPN_Concat2, [1]]          # 21 (BiFPN Softmax-weighted fusion with head P5)
  - [-1, 2, C3k2_WTConv, [1024, True]]         # 22 (P5/32-large crack detector)

  - [[16, 19, 22], 1, Detect, [nc]]            # 23 Detect(P3, P4, P5)
